<style>

body{

}

.container{

h1,h2,h3{

.menu,.submenu{

button{

button:hover{

.voltar{

    align-items:center;
    margin-top:10px;
}

#totalCarrinho{

}

.comprarTudo{

    width:100%;
    margin-top:15px;
}

.limparCarrinho{

    width:100%;
    margin-top:10px;
}

.removerBtn{
    background:red;
    border:none;
    color:white;
    padding:5px 10px;
    border-radius:8px;
    cursor:pointer;
}

.exemploFoto{
    width:100%;
    height:250px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
}

#zoomOverlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#zoomOverlay img{

#carrinhoFlutuante{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#00ff88;
    color:black;
    padding:15px 18px;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px rgba(0,255,136,0.5);
    z-index:999999;
}

#carrinhoPopup{
    position:fixed;
    bottom:90px;
    right:20px;
    width:320px;
    max-height:420px;
    overflow:auto;
    background:rgba(0,0,0,0.95);
    border:2px solid #00ff88;
    border-radius:20px;
    padding:15px;
    z-index:999999;
    display:none;
    box-shadow:0 0 20px rgba(0,255,136,0.4);
}

#listaFeedbacks div{
    background:#222;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    text-align:left;
}

</style>
</head>

<body>

<!-- LOJINHA -->

Lojinha no seu nome + foto + menu personalizado, feedback reais= R$5,00

Carro raro + King + 30k Golds = R$7

</div>

<!-- FEEDBACK -->
<div id="feedback" class="submenu" style="display:none;">

<h2>⭐ Avaliações dos clientes</h2>

<div style="background:#111;padding:12px;border-radius:15px;">
🛡 Cada cliente possui um sistema de 🆔 único automático.
</div>

<br>

<div id="mediaEstrelas"
style="font-size:25px;color:gold;font-weight:bold;">
⭐⭐⭐⭐⭐ (5.0)
</div>

<br>

<div class="exemploFoto"
onclick="abrirZoom('https://i.ibb.co/yFSLCKqB/IMG-20260514-235652.png')">

<img src="https://i.ibb.co/yFSLCKqB/IMG-20260514-235652.png"
style="width:100%;height:100%;object-fit:cover;">

</div>

<br>

<div id="areaNome"></div>

<br>

<select id="notaFeedback"
style="width:100%;padding:15px;border-radius:15px;font-size:18px;">

<option value="">⭐ Escolha as estrelas</option>
<option value="1">⭐</option>
<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>

</select>

<br><br>

<textarea id="textoFeedback"
placeholder="Só clientes que compraram podem avaliar..."
style="width:100%;height:120px;border-radius:15px;padding:10px;"></textarea>

<br><br>

<button onclick="enviarFeedback()"
style="background:green;width:100%;">
Enviar feedback
</button>

<button class="voltar" onclick="voltar()">⬅ Voltar</button>

<div id="listaFeedbacks"></div>

</div>

</div>

<!-- CARRINHO -->
<div id="carrinhoFlutuante" onclick="toggleCarrinho()">
🛒 <span id="contador">0</span>
</div>

<div id="carrinhoPopup">

<h2>🛒 Seu Carrinho</h2>

<div id="listaCarrinho"></div>

<div id="totalCarrinho">Total: R$0</div>

<button class="comprarTudo" onclick="comprarTudo()">
✅ Comprar Tudo
</button>

<button class="limparCarrinho" onclick="limparCarrinho()">
🗑 Limpar Carrinho
</button>

</div>

<!-- ZOOM -->
<div id="zoomOverlay" onclick="fecharZoom()">
<img id="zoomImg">
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

/* EMAILJS */
emailjs.init("UqrpcgQiX9oJoh6K2");

/* FIREBASE */
const firebaseConfig = {

  apiKey: "AIzaSyBaFGdMHOy59fJshA-Hdr6V9e92rLa2dzU",
  authDomain: "lojinhagean.firebaseapp.com",
  databaseURL: "https://lojinhagean-default-rtdb.firebaseio.com",
  projectId: "lojinhagean",
  storageBucket: "lojinhagean.firebasestorage.app",
  messagingSenderId: "572363932158",
  appId: "1:572363932158:web:f9babe712b0d848a09c0af",
  measurementId: "G-QR2K8NSVNG"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* CARRINHO */
let carrinho = [];

/* ID */
let userID = localStorage.getItem("userID");

if(!userID){

    userID = crypto.randomUUID();

    localStorage.setItem("userID",userID);
}

/* NOME */
let nomeUsuario =
localStorage.getItem("nomeUsuario") || "";

/* TROCA */
let trocouNome =
localStorage.getItem("trocouNome") || "false";

/* LOAD */
window.onload = function(){

    atualizarAreaNome();

    mostrarFeedbacks();
}

/* AREA NOME */
function atualizarAreaNome(){

    let areaNome =
    document.getElementById("areaNome");

    areaNome.innerHTML = `

    <div style="
    background:#111;
    padding:15px;
    border-radius:15px;
    border:2px solid #00ff88;
    text-align:left;
    ">

    <b>👤 Nome:</b><br>

    <span id="nomeAtual">
    ${nomeUsuario || "Não definido"}
    </span>

    <br><br>

    <b>🆔 ID:</b><br>
    ${userID.slice(0,6)}

    ${
        !nomeUsuario
        ?
        `
        <br><br>

        <input type="text"
        id="nomeInput"
        placeholder="Digite seu nome"
        style="
        width:100%;
        padding:12px;
        border:none;
        border-radius:12px;
        ">

        <br><br>

        <button onclick="salvarNome()"
        style="
        width:100%;
        background:#00aa88;
        ">
        Salvar Nome
        </button>
        `
        :
        trocouNome == "false"
        ?
        `
        <br><br>

        <button onclick="trocarNome()"
        style="
        background:#ff8800;
        width:100%;
        ">
        🔄 Trocar Nome
        </button>

        <br><br>

        <small style="color:#aaa;">
        ⚠ Você só pode trocar o nome mais 1 vez
        </small>
        `
        :
        `
        <br><br>

        <small style="color:red;">
        ❌ Limite de troca atingido
        </small>
        `
    }

    </div>

    `;
}

/* MENU */
function abrir(menu){

    document.getElementById("main").style.display="none";

    document.getElementById(menu).style.display="flex";
}

function voltar(){

    document.querySelectorAll(".submenu")
    .forEach(m=>{

        m.style.display="none";
    });

    document.getElementById("main").style.display="flex";
}

/* SALVAR NOME */
function salvarNome(){

    let nome =
    document.getElementById("nomeInput").value;

    if(nome.trim()==""){

        alert("Digite um nome");
        return;
    }

    localStorage.setItem("nomeUsuario",nome);

    nomeUsuario = nome;

    atualizarAreaNome();

    alert("✔ Nome salvo");
}

/* TROCAR NOME */
function trocarNome(){

    let senha = prompt(
    "Digite a senha para trocar o nome:"
    );

    if(senha !== "2010"){

        alert("Senha incorreta");
        return;
    }

    let novoNome = prompt(
    "Digite o novo nome:"
    );

    if(!novoNome || novoNome.trim()==""){

        alert("Nome inválido");
        return;
    }

    localStorage.setItem(
    "nomeUsuario",
    novoNome
    );

    localStorage.setItem(
    "trocouNome",
    "true"
    );

    nomeUsuario = novoNome;

    trocouNome = "true";

    atualizarAreaNome();

    alert("✔ Nome alterado com sucesso");
}

/* CARRINHO */
function adicionarCarrinho(nome,valor){

    carrinho.push({nome,valor});

    atualizarCarrinho();
}

function atualizarCarrinho(){

    let lista =
    document.getElementById("listaCarrinho");

    let total =
    document.getElementById("totalCarrinho");

    lista.innerHTML="";

    let soma=0;

    carrinho.forEach((item,index)=>{

        soma += item.valor;

        lista.innerHTML += `

        <div class="itemCarrinho">

        <span>
        ${item.nome} - R$${item.valor}
        </span>

        <button class="removerBtn"
        onclick="removerItem(${index})">
        ❌
        </button>

        </div>

        `;
    });

    total.innerHTML =
    "Total: R$"+soma;

    document.getElementById("contador")
    .innerText = carrinho.length;
}

function removerItem(index){

    carrinho.splice(index,1);

    atualizarCarrinho();
}

function limparCarrinho(){

    carrinho=[];

    atualizarCarrinho();
}

function toggleCarrinho(){

    let popup =
    document.getElementById("carrinhoPopup");

    popup.style.display =
    popup.style.display=="block"
    ? "none"
    : "block";
}

/* COMPRAR */
function comprarTudo(){

    if(carrinho.length==0){

        alert("Carrinho vazio");
        return;
    }

    let numero="5598981666909";

    let msg =
    "Olá quero comprar:%0A%0A";

    let soma=0;

    carrinho.forEach(i=>{

        msg +=
        "- "+i.nome+
        " R$"+i.valor+
        "%0A";

        soma += i.valor;
    });

    msg += "%0ATotal: R$"+soma;

    window.open(
    "https://wa.me/"+numero+"?text="+msg
    );

    localStorage.setItem(
    "podeAvaliar",
    "true"
    );
}

/* FEEDBACK */
function enviarFeedback(){

    let podeAvaliar =
    localStorage.getItem("podeAvaliar");

    if(!nomeUsuario){

        alert("Salve seu nome primeiro");
        return;
    }

    if(!podeAvaliar){

        alert("Compre algo primeiro");
        return;
    }

    let texto =
    document.getElementById("textoFeedback").value;

    let estrelas =
    document.getElementById("notaFeedback").value;

    if(estrelas==""){

        alert("Escolha as estrelas");
        return;
    }

    if(texto.trim()==""){

        alert("Digite algo");
        return;
    }

    db.ref("feedbacks").push({

        nome:nomeUsuario,
        id:userID,
        texto:texto,
        estrelas:parseInt(estrelas),
        data:new Date().toLocaleString()

    });

    emailjs.send(
    "service_5wf3vf2",
    "template_0qp2ixo",
    {
        nome: nomeUsuario,
        estrelas: estrelas,
        mensagem: texto,
        id: userID.slice(0,6)
    });

    localStorage.removeItem("podeAvaliar");

    document.getElementById("textoFeedback").value="";
    document.getElementById("notaFeedback").value="";

    alert("✔ Feedback enviado");
}

/* MOSTRAR FEEDBACKS */
function mostrarFeedbacks(){

    let area =
    document.getElementById("listaFeedbacks");

    db.ref("feedbacks").on("value",(snapshot)=>{

        area.innerHTML="";

        let dados = snapshot.val();

        if(!dados){

            document.getElementById("mediaEstrelas")
            .innerHTML =
            "⭐⭐⭐⭐⭐ (5.0)";

            return;
        }

        let lista =
        Object.values(dados).reverse();

        let soma=0;

        lista.forEach(f=>{

            soma += f.estrelas;

            let estrelas =
            "⭐".repeat(f.estrelas);

            area.innerHTML += `

            <div>

            <b>${f.nome}</b>

            <br>

            🆔 ${f.id.slice(0,6)}

            <br><br>

            <span style="
            color:gold;
            font-size:20px;
            ">
            ${estrelas}
            </span>

            <br><br>

            ${f.texto}

            <br><br>

            <small>${f.data}</small>

            </div>

            `;
        });

        let media =
        (soma/lista.length).toFixed(1);

        document.getElementById("mediaEstrelas")
        .innerHTML =
        "⭐ Média: "+media+"/5";

    });
}

/* ZOOM */
function abrirZoom(img){

    document.getElementById("zoomOverlay")
    .style.display="flex";

    document.getElementById("zoomImg")
    .src=img;
}

function fecharZoom(){

    document.getElementById("zoomOverlay")
    .style.display="none";
}

</script>

</body>
</html>
